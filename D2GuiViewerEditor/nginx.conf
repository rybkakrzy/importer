server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresja gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Obsługa Angular routing (HTML5 history API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MIME fix dla ES modules — domyślne nginx/mime.types nie zna .mjs,
    # przez co worker PDF.js (pdf.worker.min.mjs) leci jako application/octet-stream
    # i przeglądarka odrzuca go przy strict MIME checking dla module scripts.
    # Ta lokalizacja musi być PRZED ogólnym cache-em, bo nginx wybiera pierwszą pasującą regex location.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Content-Type "application/wasm" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache dla statycznych assetów z hashami (Angular outputHashing)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brak cache dla index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check dla GCP / load balancera
    location = /health {
        access_log off;
        add_header Content-Type "application/json";
        return 200 '{"status":"healthy"}';
    }
}
