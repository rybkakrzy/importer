@if (value(); as v) {
  <span class="classification-badge" [class]="levelClass()" [attr.title]="'Klasyfikacja dokumentu: ' + v">
    <svg class="classification-icon" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
      <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    </svg>
    <span class="classification-prefix">Klasyfikacja:</span>
    <span class="classification-value">{{ v }}</span>
  </span>
}
