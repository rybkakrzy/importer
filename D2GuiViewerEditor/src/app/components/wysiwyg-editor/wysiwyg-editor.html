<div class="wysiwyg-editor-wrapper">
  <div class="pages-container">
    <!-- Każda strona A4 -->
    @for (page of pageContents(); track $index) {
      <div class="page-wrapper">
        <div class="page" 
             [class.landscape]="pageOrientation === 'landscape'"
             [attr.data-page-number]="$index + 1">
          
          <!-- Nagłówek strony -->
          <div class="page-header"
               [class.editing]="editingSection() === 'header'"
               [style.min-height.cm]="headerHeight()"
               [style.padding-left.px]="pageMargins().left * 37.8"
               [style.padding-right.px]="pageMargins().right * 37.8"
               (click)="startEditingHeader($event)"
               (dblclick)="startEditingHeader($event)">
            @if (editingSection() === 'header' && $index === 0) {
              <div
                #headerContent
                class="header-editor-content"
                [attr.contenteditable]="readOnly ? 'false' : 'true'"
                spellcheck="true"
                [attr.placeholder]="''"
                (input)="onHeaderInput($event)"
              ></div>
              <!-- Pasek nagłówka przeniesiony do d2-header-footer-panel (dock po lewej). -->
            } @else {
              <div class="header-display" [innerHTML]="getHeaderContentSafe($index)"></div>
            }
          </div>
          
          @if ($index === 0) {
            <div 
              #pageEditor
              class="editor-content"
              [attr.contenteditable]="readOnly ? 'false' : 'true'"
              spellcheck="true"
              [attr.data-page-index]="$index"
              [attr.placeholder]="'Zacznij pisać...'"
              [style.padding-left.px]="pageMargins().left * 37.8"
              [style.padding-right.px]="pageMargins().right * 37.8"
              [style.padding-top.px]="contentPaddingTop()"
              [style.padding-bottom.px]="contentPaddingBottom()"
              [style.font-size]="documentDefaultFontSize()"
              [style.font-family]="documentDefaultFontFamily()"
              [innerHTML]="getPageContentSafe($index)"
              (focusin)="setActivePage($index, $event)"
              (input)="onPageInput($index, $event)"
              (mouseup)="saveSelection()"
              (keyup)="saveSelection()"
              (click)="stopEditingHeaderFooter()"
            ></div>
          } @else {
            <div 
              #pageEditor
              class="editor-content"
              [attr.contenteditable]="readOnly ? 'false' : 'true'"
              spellcheck="true"
              [attr.data-page-index]="$index"
              [style.padding-left.px]="pageMargins().left * 37.8"
              [style.padding-right.px]="pageMargins().right * 37.8"
              [style.padding-top.px]="contentPaddingTop()"
              [style.padding-bottom.px]="contentPaddingBottom()"
              [style.font-size]="documentDefaultFontSize()"
              [style.font-family]="documentDefaultFontFamily()"
              [innerHTML]="getPageContentSafe($index)"
              (focusin)="setActivePage($index, $event)"
              (input)="onPageInput($index, $event)"
              (mouseup)="saveSelection()"
              (keyup)="saveSelection()"
              (click)="stopEditingHeaderFooter()"
            ></div>
          }

          <!-- Stopka strony -->
          <div class="page-footer"
               [class.editing]="editingSection() === 'footer'"
               [style.min-height.cm]="footerHeight()"
               [style.padding-left.px]="pageMargins().left * 37.8"
               [style.padding-right.px]="pageMargins().right * 37.8"
               (click)="startEditingFooter($event)"
               (dblclick)="startEditingFooter($event)">
            @if (editingSection() === 'footer' && $index === 0) {
              <!-- Pasek stopki przeniesiony do d2-header-footer-panel (dock po lewej). -->
              <div
                #footerContent
                class="footer-editor-content"
                [attr.contenteditable]="readOnly ? 'false' : 'true'"
                spellcheck="true"
                [attr.placeholder]="''"
                (input)="onFooterInput($event)"
              ></div>
            } @else {
              <div class="footer-display" [innerHTML]="getFooterContentSafe($index)"></div>
            }
          </div>

          <!-- Prowadnice marginesów (przerywane linie jak w MS Word / Docs) -->
          @if (showMarginGuides) {
            <div class="margin-guides">
              <div class="margin-guide margin-guide-top" [style.top.px]="pageMargins().top * 37.8"></div>
              <div class="margin-guide margin-guide-bottom" [style.bottom.px]="pageMargins().bottom * 37.8"></div>
              <div class="margin-guide margin-guide-left" [style.left.px]="pageMargins().left * 37.8"></div>
              <div class="margin-guide margin-guide-right" [style.right.px]="pageMargins().right * 37.8"></div>
            </div>
          }
        </div>

        <!-- Separator między stronami - styl Google Docs -->
        @if ($index < pageContents().length - 1) {
          <div class="page-separator"></div>
        }
      </div>
    }
  </div>
</div>
