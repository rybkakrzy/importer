<aside class="img-panel" role="region" aria-label="Właściwości obrazu">
  <div class="img-panel__header">
    <h3>Obraz</h3>
    <button type="button"
            class="img-panel__close"
            (click)="close.emit()"
            title="Zamknij">×</button>
  </div>

  @if (current(); as s) {
    <section class="img-panel__group">
      <h4>Rozmiar</h4>
      <label class="img-panel__row">
        <span>Szerokość</span>
        <input type="number"
               min="16"
               max="4000"
               step="1"
               [ngModel]="_widthInput()"
               (ngModelChange)="_widthInput.set($event)"
               (blur)="applyWidth()"
               (keyup.enter)="applyWidth()">
        <span class="img-panel__unit">px</span>
      </label>
      <label class="img-panel__row">
        <span>Wysokość</span>
        <input type="number"
               min="16"
               max="4000"
               step="1"
               [ngModel]="_heightInput()"
               (ngModelChange)="_heightInput.set($event)"
               (blur)="applyHeight()"
               (keyup.enter)="applyHeight()">
        <span class="img-panel__unit">px</span>
      </label>
      <label class="img-panel__row img-panel__row--checkbox">
        <input type="checkbox"
               [checked]="lockAspect"
               (change)="toggleLock($any($event.target).checked)">
        <span>Zachowaj proporcje</span>
      </label>
      <button type="button"
              class="img-panel__action"
              (click)="resetAspect.emit()"
              title="Wymuś szerokość zgodną z oryginalnym aspektem">
        Przywróć proporcje
      </button>
    </section>

    <section class="img-panel__group">
      <h4>Wyrównanie</h4>
      <div class="img-panel__align-row">
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.alignment === 'left'"
                (click)="align('left')"
                title="Do lewej">L</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.alignment === 'center'"
                (click)="align('center')"
                title="Do środka">C</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.alignment === 'right'"
                (click)="align('right')"
                title="Do prawej">R</button>
        <button type="button"
                class="img-panel__icon-btn img-panel__icon-btn--ghost"
                [class.is-active]="s.alignment === null"
                (click)="clearAlign()"
                title="Bez wyrównania">—</button>
      </div>
    </section>

    <section class="img-panel__group">
      <h4>Zawijaj tekst</h4>
      <div class="img-panel__wrap-grid">
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.positionMode === 'inline'"
                (click)="setMode('inline')"
                title="Równo z tekstem (inline)">Równo&nbsp;z&nbsp;tekstem</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.positionMode === 'square'"
                (click)="setMode('square')"
                title="Ramka — tekst opływa prostokątnie">Ramka</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.positionMode === 'topBottom'"
                (click)="setMode('topBottom')"
                title="Góra i dół — tekst nad i pod obrazem">Góra&nbsp;i&nbsp;dół</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.positionMode === 'behind'"
                (click)="setMode('behind')"
                title="Za tekstem (warstwa pod tekstem)">Za&nbsp;tekstem</button>
        <button type="button"
                class="img-panel__icon-btn"
                [class.is-active]="s.positionMode === 'front'"
                (click)="setMode('front')"
                title="Przed tekstem (warstwa nad tekstem)">Przed&nbsp;tekstem</button>
        <button type="button"
                class="img-panel__icon-btn"
                disabled
                title="Wymaga reflow tekstu wokół kształtu — w przygotowaniu">Przylegle</button>
        <button type="button"
                class="img-panel__icon-btn"
                disabled
                title="Wymaga reflow tekstu wokół kształtu — w przygotowaniu">Na&nbsp;wskroś</button>
      </div>
    </section>

    <section class="img-panel__group">
      <h4>Obramowanie</h4>
      <label class="img-panel__row img-panel__row--checkbox">
        <input type="checkbox"
               [checked]="s.border.enabled"
               (change)="setBorder({ enabled: $any($event.target).checked })">
        <span>Obramowanie</span>
      </label>
      @if (s.border.enabled) {
        <label class="img-panel__row">
          <span>Kolor</span>
          <input type="color"
                 [value]="s.border.color"
                 (input)="setBorder({ color: $any($event.target).value })">
        </label>
        <label class="img-panel__row">
          <span>Grubość</span>
          <input type="number"
                 min="1"
                 max="20"
                 step="1"
                 [value]="s.border.widthPx"
                 (change)="setBorder({ widthPx: +$any($event.target).value })">
          <span class="img-panel__unit">px</span>
        </label>
        <label class="img-panel__row">
          <span>Styl</span>
          <select [value]="s.border.style"
                  (change)="setBorder({ style: $any($event.target).value })">
            <option value="solid">Ciągła</option>
            <option value="dashed">Przerywana</option>
            <option value="dotted">Kropkowana</option>
          </select>
        </label>
      }
    </section>

    <section class="img-panel__group">
      <h4>Przytnij</h4>
      <div class="img-panel__crop-grid">
        <label class="img-panel__row img-panel__row--crop">
          <span>Lewy</span>
          <input type="number" min="0" max="95" step="1"
                 [value]="s.crop.left"
                 (change)="setCrop('left', +$any($event.target).value)">
          <span class="img-panel__unit">%</span>
        </label>
        <label class="img-panel__row img-panel__row--crop">
          <span>Prawy</span>
          <input type="number" min="0" max="95" step="1"
                 [value]="s.crop.right"
                 (change)="setCrop('right', +$any($event.target).value)">
          <span class="img-panel__unit">%</span>
        </label>
        <label class="img-panel__row img-panel__row--crop">
          <span>Górny</span>
          <input type="number" min="0" max="95" step="1"
                 [value]="s.crop.top"
                 (change)="setCrop('top', +$any($event.target).value)">
          <span class="img-panel__unit">%</span>
        </label>
        <label class="img-panel__row img-panel__row--crop">
          <span>Dolny</span>
          <input type="number" min="0" max="95" step="1"
                 [value]="s.crop.bottom"
                 (change)="setCrop('bottom', +$any($event.target).value)">
          <span class="img-panel__unit">%</span>
        </label>
      </div>
      <button type="button"
              class="img-panel__action"
              (click)="resetCropClick()"
              title="Przywróć pełen kadr">
        Resetuj przycięcie
      </button>
    </section>

    <section class="img-panel__group">
      <button type="button"
              class="img-panel__action img-panel__action--danger"
              (click)="removeImage.emit()">
        Usuń obraz
      </button>
    </section>
  } @else {
    <p class="img-panel__empty">Zaznacz obraz, aby zobaczyć ustawienia.</p>
  }
</aside>
