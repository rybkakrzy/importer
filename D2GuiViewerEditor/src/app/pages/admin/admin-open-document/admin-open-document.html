<div class="admin-page">
  <div class="page-header">
    <div class="header-top">
      <div>
        <h2 class="page-title">Otwórz plik w edytorze</h2>
        <p class="page-subtitle">
          Wpisz identyfikatory dokumentu, aby otworzyć go bezpośrednio w edytorze.
        </p>
      </div>
    </div>
  </div>

  <form class="open-form" (ngSubmit)="open()">
    <label class="field">
      <span class="field-label">Master ID <span class="req">*</span></span>
      <input
        type="text"
        class="field-input"
        [ngModel]="masterId()"
        (ngModelChange)="masterId.set($event)"
        name="masterId"
        placeholder="np. 3f2a…"
        autocomplete="off"
        aria-label="Master ID"
      />
    </label>

    <label class="field">
      <span class="field-label">Version ID <span class="optional">(opcjonalne)</span></span>
      <input
        type="text"
        class="field-input"
        [ngModel]="versionId()"
        (ngModelChange)="versionId.set($event)"
        name="versionId"
        placeholder="puste = podgląd wersji bazowej"
        autocomplete="off"
        aria-label="Version ID"
      />
      <span class="field-hint">
        Z Version ID otworzysz wskazaną wersję do edycji; bez niego — podgląd oryginału.
      </span>
    </label>

    <div class="form-actions">
      <button type="submit" class="btn-open" [disabled]="!canOpen()">Otwórz</button>
    </div>
  </form>
</div>
